name: build-oldnet
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "30 5 * * *"   # follow upstream Bazzite daily
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: oldnet,        base: "ghcr.io/ublue-os/bazzite-dx:stable" }
          - { image: oldnet-nvidia, base: "ghcr.io/ublue-os/bazzite-dx-nvidia:stable" }
          - { image: oldnet-deck,   base: "ghcr.io/ublue-os/bazzite-deck:stable" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            IMAGE_NAME=${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
