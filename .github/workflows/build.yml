name: build-oldnet
on:
  # Work happens on dev (published as :dev); main gets merges once tested and is the
  # only branch that publishes :latest. test/** is for throwaway experiments.
  push: { branches: [main, dev, "test/**"] }
  pull_request:
  schedule:
    - cron: "30 5 * * *"   # follow upstream Bazzite daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: oldnet,        base: "ghcr.io/ublue-os/bazzite-dx:stable" }
          - { image: oldnet-nvidia, base: "ghcr.io/ublue-os/bazzite-dx-nvidia:stable" }
          - { image: oldnet-deck,   base: "ghcr.io/ublue-os/bazzite-deck:stable" }
    steps:
      # ghcr.io requires lowercase repository names (owner is "LemosF")
      - id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # main -> :latest and :<sha>; any other branch -> :<branch> and :<branch>-<short sha>
      - id: tag
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "main=latest" >> "$GITHUB_OUTPUT"
            echo "pinned=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            branch=$(tr -c 'a-zA-Z0-9_.\n-' '-' <<<"$GITHUB_REF_NAME")
            echo "main=$branch" >> "$GITHUB_OUTPUT"
            echo "pinned=$branch-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # Bazzite images are ~10 GB; the default runner disk is too small
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            IMAGE_NAME=${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.reg.outputs.registry }}/${{ matrix.image }}:${{ steps.tag.outputs.main }}
            ${{ steps.reg.outputs.registry }}/${{ matrix.image }}:${{ steps.tag.outputs.pinned }}
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ steps.reg.outputs.registry }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
