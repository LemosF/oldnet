# TEMPORARY: inspects how the Bazzite desktop base handles the login manager, and
# what installing SDDM in its place changes. Read-only for the repo; removed once
# the SDDM switch is written.
name: diag-login
on:
  push: { branches: [login-sddm] }
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Inspect bazzite-dx and a trial SDDM swap
        run: |
          docker run --rm ghcr.io/ublue-os/bazzite-dx:stable bash -c '
            sec() { echo; echo "===== $*"; }
            sec packages;            rpm -q sddm plasma-login-manager sddm-wayland-plasma sddm-kcm qt6-qtvirtualkeyboard qt6-qtdeclarative || true
            sec display-manager;     ls -l /etc/systemd/system/display-manager.service || true
            sec enabled;             systemctl is-enabled plasmalogin.service sddm.service 2>&1 || true
            sec presets;             grep -rs -E "plasmalogin|sddm|display-manager" /usr/lib/systemd/system-preset /etc/systemd/system-preset || true
            sec plm-files;           rpm -ql plasma-login-manager | grep -E "^/(etc|usr/lib/(sysusers|tmpfiles)\.d|usr/lib/systemd|usr/share/dbus-1|usr/lib/plasmalogin|usr/bin)" || true
            sec plm-scripts;         rpm -q --scripts plasma-login-manager || true
            sec plm-config;          for f in /etc/plasmalogin.conf /etc/plasmalogin.conf.d/* /usr/lib/plasmalogin/*; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done
            sec plm-pam;             cat /etc/pam.d/plasmalogin 2>/dev/null || true
            sec sddm-repo;           dnf5 -q repoquery --qf "%{name}-%{version}-%{release}.%{arch}\n" "sddm*" 2>/dev/null || true
            sec sddm-requires;       dnf5 -q repoquery --requires sddm 2>/dev/null || true
            sec swap;                dnf5 -y -q install sddm && dnf5 -y remove plasma-login-manager 2>&1 | tail -20
            sec after-remove-dm;     ls -l /etc/systemd/system/display-manager.service 2>&1 || true
            sec enable;              systemctl enable --force sddm.service 2>&1; ls -l /etc/systemd/system/display-manager.service
            sec sddm-files;          rpm -ql sddm | grep -E "^/(etc|usr/lib/(sysusers|tmpfiles)\.d|usr/lib/systemd|usr/lib/sddm|usr/bin|usr/share/dbus-1)"
            sec sddm-scripts;        rpm -q --scripts sddm
            sec sddm-pam;            for f in /etc/pam.d/sddm*; do echo "--- $f"; cat "$f"; done
            sec sddm-confd;          for f in /usr/lib/sddm/sddm.conf.d/* /etc/sddm.conf.d/* /etc/sddm.conf; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done
            sec greeter;             ls /usr/bin/sddm-greeter* || true
            sec virtualkeyboard;     ls -d /usr/lib64/qt6/qml/QtQuick/VirtualKeyboard 2>&1 || true
            sec selinux;             ls -Z /usr/bin/sddm 2>/dev/null || true
          '
